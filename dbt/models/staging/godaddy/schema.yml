
version: 2

models:
  - name: stg_auction_inventory
    description: "Clean staging view of GoDaddy auction inventory."

    data_tests:
      - unique:
          arguments:
            column_name: "CONCAT(CAST(snapshot_date AS STRING), '|', listing_id)"
      - unique:
          arguments:
            column_name: "CONCAT(CAST(snapshot_date AS STRING), '|', domain_name)"

    columns:
      - name: listing_id
        description: "Unique identifier for each auction listing."
        data_tests:
          - not_null

      - name: domain_name
        data_tests:
          - not_null

      - name: auction_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Bid', 'Buy']

      - name: price
        data_tests:
          - not_null

      - name: auction_end_time
        data_tests:
          - not_null

      - name: snapshot_date
        data_tests:
          - not_null
